# Weekly: check every preset's official source still exists. Portals move PDFs (UPSC did in 2026);
# a dead link means the preset needs re-checking. Opens one issue listing dead links (404/410 only:
# many government sites block bots with 403s, which aren't treated as dead).
name: Source check

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          dead=""
          while read -r u; do
            code=$(curl -s -o /dev/null -L --max-time 30 -A "Mozilla/5.0 PortalPic source check" -w '%{http_code}' "$u")
            echo "$code $u"
            if [ "$code" = 404 ] || [ "$code" = 410 ]; then dead="$dead"$'\n'"- $u ($code)"; fi
          done < <(grep -oE 'source: "https://[^"]+"' src/lib/presets.ts | sed -E 's/source: "(.*)"/\1/' | sort -u)
          [ -z "$dead" ] && exit 0
          title="Dead official source links"
          if gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q .; then exit 0; fi
          gh issue create -R "$REPO" --title "$title" --body "These preset sources no longer exist. Find the new official page, check the rules still match, and update \`src/lib/presets.ts\`:$dead"
